name: "Triage: Issues, Comments, PRs"
# PRs use pull_request_target so fork PRs from first-time contributors notify
# without waiting for workflow approval. This is safe because the reusable
# workflow never checks out or runs PR code: it reads event fields through env
# vars and posts a JSON payload built with jq.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened]
# The notification needs no GITHUB_TOKEN access; the repo default is write.
permissions: {}
jobs:
  notify:
    uses: sdkman/.github/.github/workflows/reusable-triage-events.yml@main
    secrets:
      OPENCLAW_HOOK_URL: ${{ secrets.OPENCLAW_HOOK_URL }}
      OPENCLAW_HOOK_TOKEN: ${{ secrets.OPENCLAW_HOOK_TOKEN }}
