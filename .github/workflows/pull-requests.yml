name: Pull Requests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Classify change set
        id: classify
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(requests|\.applied)/'; then
            echo "request=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save PR number
        if: steps.classify.outputs.request == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number
      - name: Check request
        if: steps.classify.outputs.request == 'true'
        run: cargo run --release --locked -- check --base HEAD^1 --report report.md
      - name: Publish check report
        if: always() && steps.classify.outputs.request == 'true'
        run: |
          if [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload check report
        if: always() && steps.classify.outputs.request == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: |
            report.md
            pr-number
          if-no-files-found: ignore
      - name: Check formatting
        if: steps.classify.outputs.request != 'true'
        run: cargo fmt --check
      - name: Lint
        if: steps.classify.outputs.request != 'true'
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        if: steps.classify.outputs.request != 'true'
        run: cargo test
