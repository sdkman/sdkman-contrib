name: Pull Requests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Classify change set
        id: classify
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(requests|\.applied)/'; then
            echo "request=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check formatting
        if: steps.classify.outputs.request != 'true'
        run: cargo fmt --check
      - name: Lint
        if: steps.classify.outputs.request != 'true'
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        if: steps.classify.outputs.request != 'true'
        run: cargo test
