name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the tagged commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require the tag to match Cargo.toml
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: LINUX_X64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            suffix: linux-x64.tar.gz
          - platform: LINUX_ARM64
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            suffix: linux-arm64.tar.gz
          - platform: MAC_X64
            target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-x64.tar.gz
          - platform: MAC_ARM64
            target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64.tar.gz
          - platform: WINDOWS_X64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x64.zip
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - name: Install cross
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build with cross
        if: runner.os == 'Linux'
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Build
        if: runner.os != 'Linux'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p dist "contrib-$VERSION/bin"
          cp "target/$TARGET/release/contrib" "contrib-$VERSION/bin/contrib"
          COPYFILE_DISABLE=1 tar -czf "dist/contrib-$VERSION-$SUFFIX" "contrib-$VERSION"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p dist "contrib-$VERSION/bin"
          cp "target/$TARGET/release/contrib.exe" "contrib-$VERSION/bin/contrib.exe"
          7z a "dist/contrib-$VERSION-$SUFFIX" "contrib-$VERSION"
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: contrib-${{ matrix.platform }}
          path: dist/contrib-*

  github-release:
    name: Create GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: contrib-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes packages/*
          fi

  publish-state:
    name: Publish to State
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      URL_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}

    steps:
      - name: Download release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir packages
      - name: Hash release packages
        id: sha256
        run: |
          for suffix in linux-arm64.tar.gz macos-x64.tar.gz macos-arm64.tar.gz windows-x64.zip linux-x64.tar.gz; do
            hash=$(sha256sum "packages/contrib-$VERSION-$suffix" | cut -d' ' -f1)
            if [ -z "$hash" ]; then
              echo "no sha256 for contrib-$VERSION-$suffix" >&2
              exit 1
            fi
            echo "${suffix%%.*}=$hash" >> "$GITHUB_OUTPUT"
          done
      - name: Publish LINUX_ARM64
        uses: sdkman/sdkman-release-action@v1
        with:
          email: ${{ secrets.VENDOR_EMAIL }}
          password: ${{ secrets.VENDOR_PASSWORD }}
          backend: ${{ vars.CONTRIB_STATE_URL || 'https://state.sdkman.io' }}
          candidate: contrib
          version: ${{ env.VERSION }}
          platform: LINUX_ARM64
          url: ${{ env.URL_BASE }}/contrib-${{ env.VERSION }}-linux-arm64.tar.gz
          checksum-sha-256: ${{ steps.sha256.outputs.linux-arm64 }}
          tags: stable
      - name: Publish MAC_X64
        uses: sdkman/sdkman-release-action@v1
        with:
          email: ${{ secrets.VENDOR_EMAIL }}
          password: ${{ secrets.VENDOR_PASSWORD }}
          backend: ${{ vars.CONTRIB_STATE_URL || 'https://state.sdkman.io' }}
          candidate: contrib
          version: ${{ env.VERSION }}
          platform: MAC_X64
          url: ${{ env.URL_BASE }}/contrib-${{ env.VERSION }}-macos-x64.tar.gz
          checksum-sha-256: ${{ steps.sha256.outputs.macos-x64 }}
          tags: stable
      - name: Publish MAC_ARM64
        uses: sdkman/sdkman-release-action@v1
        with:
          email: ${{ secrets.VENDOR_EMAIL }}
          password: ${{ secrets.VENDOR_PASSWORD }}
          backend: ${{ vars.CONTRIB_STATE_URL || 'https://state.sdkman.io' }}
          candidate: contrib
          version: ${{ env.VERSION }}
          platform: MAC_ARM64
          url: ${{ env.URL_BASE }}/contrib-${{ env.VERSION }}-macos-arm64.tar.gz
          checksum-sha-256: ${{ steps.sha256.outputs.macos-arm64 }}
          tags: stable
      - name: Publish WINDOWS_X64
        uses: sdkman/sdkman-release-action@v1
        with:
          email: ${{ secrets.VENDOR_EMAIL }}
          password: ${{ secrets.VENDOR_PASSWORD }}
          backend: ${{ vars.CONTRIB_STATE_URL || 'https://state.sdkman.io' }}
          candidate: contrib
          version: ${{ env.VERSION }}
          platform: WINDOWS_X64
          url: ${{ env.URL_BASE }}/contrib-${{ env.VERSION }}-windows-x64.zip
          checksum-sha-256: ${{ steps.sha256.outputs.windows-x64 }}
          tags: stable
      # State moves the default with the LINUX_X64 `stable` tag, so LINUX_X64 goes last.
      - name: Publish LINUX_X64
        uses: sdkman/sdkman-release-action@v1
        with:
          email: ${{ secrets.VENDOR_EMAIL }}
          password: ${{ secrets.VENDOR_PASSWORD }}
          backend: ${{ vars.CONTRIB_STATE_URL || 'https://state.sdkman.io' }}
          candidate: contrib
          version: ${{ env.VERSION }}
          platform: LINUX_X64
          url: ${{ env.URL_BASE }}/contrib-${{ env.VERSION }}-linux-x64.tar.gz
          checksum-sha-256: ${{ steps.sha256.outputs.linux-x64 }}
          tags: stable
