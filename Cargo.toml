[package]
name = "sdkman-contrib"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "contrib"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
hex = "0.4.3"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
url = "2.5.8"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tiny_http = "0.12.0"
