[package]
name = "sdkman-contrib"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "contrib"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"

[dev-dependencies]
tempfile = "3.27.0"
